# Кастомные запросы postgres_exporter (конвенции — STRUCTURE.md «Стенд»).
# Имя ключа = префикс метрик (pg_wal_position_* и т.д.).

# Абсолютная позиция WAL на primary (байт от 0/0) — рост = интенсивность записи.
pg_wal_position:
  query: |
    SELECT pg_wal_lsn_diff(pg_current_wal_lsn(), '0/0')::double precision AS bytes
    WHERE NOT pg_is_in_recovery()
  metrics:
    - bytes: {usage: GAUGE, description: "Текущая позиция WAL (байт от 0/0), только primary"}

# Каталог pg_wal: файлов и суммарный объём (удерживаемый WAL); работает и на реплике.
pg_wal_dir:
  query: |
    SELECT count(*)::double precision AS files,
           coalesce(sum(size), 0)::double precision AS bytes
    FROM pg_ls_waldir()
  metrics:
    - files: {usage: GAUGE, description: "Файлов в pg_wal"}
    - bytes: {usage: GAUGE, description: "Суммарный объём pg_wal, байт"}

# Слоты репликации: занятость, удерживаемый WAL, wal_status, плагин, synced (копии на standby не видны).
pg_slot:
  query: |
    SELECT slot_name,
           CASE WHEN active THEN 1 ELSE 0 END AS active,
           pg_wal_lsn_diff(pg_current_wal_lsn(), restart_lsn)::double precision AS wal_retained_bytes,
           wal_status,
           plugin,
           CASE WHEN synced THEN 1 ELSE 0 END AS synced
    FROM pg_replication_slots
    WHERE NOT pg_is_in_recovery() AND restart_lsn IS NOT NULL
  metrics:
    - slot_name: {usage: LABEL, description: "Имя слота"}
    - active: {usage: GAUGE, description: "Слот занят потребителем"}
    - wal_retained_bytes: {usage: GAUGE, description: "WAL, удерживаемый слотом (retention)"}
    - wal_status: {usage: LABEL, description: "reserved/extended/unreserved/lost"}
    - plugin: {usage: LABEL, description: "Плагин декодирования"}
    - synced: {usage: GAUGE, description: "Слот синхронизирован со standby"}

# Отставание подтверждения: текущий WAL − confirmed_flush_lsn (только слоты с подтверждением).
pg_slot_flush_lag:
  query: |
    SELECT slot_name,
           pg_wal_lsn_diff(pg_current_wal_lsn(), confirmed_flush_lsn)::double precision AS bytes
    FROM pg_replication_slots
    WHERE NOT pg_is_in_recovery() AND confirmed_flush_lsn IS NOT NULL
  metrics:
    - slot_name: {usage: LABEL, description: "Имя слота"}
    - bytes: {usage: GAUGE, description: "Отставание confirmed_flush от текущего WAL"}

# Запас WAL до инвалидизации по max_slot_wal_keep_size (лимит -1 — метрика пустая).
pg_slot_safe_wal:
  query: |
    SELECT slot_name,
           safe_wal_size::double precision AS bytes
    FROM pg_replication_slots
    WHERE NOT pg_is_in_recovery() AND safe_wal_size IS NOT NULL
  metrics:
    - slot_name: {usage: LABEL, description: "Имя слота"}
    - bytes: {usage: GAUGE, description: "Запас WAL до инвалидизации слота"}

# Репликация: streaming и replay-lag walsender'ов (физические pg2/pg3 + логический cdc-outbox).
pg_replication:
  query: |
    SELECT application_name,
           CASE WHEN state = 'streaming' THEN 1 ELSE 0 END AS streaming,
           pg_wal_lsn_diff(pg_current_wal_lsn(), replay_lsn)::double precision AS replay_lag_bytes,
           sync_state
    FROM pg_stat_replication
    WHERE NOT pg_is_in_recovery() AND replay_lsn IS NOT NULL
  metrics:
    - application_name: {usage: LABEL, description: "Имя walsender-клиента"}
    - streaming: {usage: GAUGE, description: "Соединение в состоянии streaming"}
    - replay_lag_bytes: {usage: GAUGE, description: "Отставание replay, байт"}
    - sync_state: {usage: LABEL, description: "sync/quasi-sync/async"}
