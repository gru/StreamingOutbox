# Prometheus: pull model, scrape interval ~5s

global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    stand: streaming-outbox

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: etcd
    static_configs:
      - targets:
          - etcd1:2379
          - etcd2:2379
          - etcd3:2379

  - job_name: writer
    static_configs:
      - targets: ['writer:8080']

  # PostgreSQL: replication lag, состояние logical slot outbox_slot,
  # WAL retention — кастомные запросы postgres-exporter-queries.yaml рядом с этим файлом.
  - job_name: postgres-exporter
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Kafka: доступность брокеров, offsets топиков.
  - job_name: kafka-exporter
    static_configs:
      - targets: ['kafka-exporter:9308']

  # Валидатор доставки: потребление topic, валидации прогонов (pass/fail),
  # состояние.
  - job_name: kafka-validator
    static_configs:
      - targets: ['kafka-validator:8080']

  # Outbox-сервис: метрики конвейера доставки outbox→Kafka.
  - job_name: cdc-outbox
    static_configs:
      - targets:
          - cdc-outbox-1:8080
          # - cdc-outbox-2:8080   # включается вместе с профилем redundancy
