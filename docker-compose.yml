# Тестовый стенд проекта streaming-outbox (docs/stand.md, docs/dependencies.md §1):
# Patroni/PostgreSQL 17 + etcd + HAProxy + Kafka KRaft + Prometheus.
# Минимальный перенос из исследовательского стенда streaming-polling-outbox:
# PgBouncer, cdc-слой (SECURITY DEFINER peek/advance, sys_app), CDC-сервисы
# polling/streaming и cAdvisor НЕ переносятся.
#
# ГРАБЛИ: никогда не запускать `docker compose up`/`run` без `--no-deps` на живом
# стенде — compose реконсилят весь граф зависимостей и могут пересоздать
# pg-контейнеры (одновременный рестарт всех нод Patroni = флап промоушенов).
# После пересоздания pg-контейнеров — `docker compose restart haproxy`.

name: streaming-outbox

networks:
  outbox-net:
    driver: bridge
    ipam:
      config:
        # Фиксированная подсеть для детерминизма адресов стенда; отличается от
        # 10.99.0.0/16 старого стенда streaming-polling-outbox — сети не конфликтуют
        # (host-порты при этом совпадают: оба стенда одновременно не поднять).
        - subnet: 10.98.0.0/16

volumes:
  etcd1_data: {}
  etcd2_data: {}
  etcd3_data: {}
  pg1_data: {}
  pg2_data: {}
  pg3_data: {}
  kafka1_data: {}
  kafka2_data: {}
  kafka3_data: {}
  prometheus_data: {}

services:

  # ---------- DCS для Patroni ----------

  etcd1:
    image: gcr.io/etcd-development/etcd:v3.5.17
    command:
      - etcd
      - --name=etcd1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd1:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-token=outbox-etcd
      - --initial-cluster-state=new
      - --auto-compaction-retention=1
    networks: [outbox-net]
    volumes:
      - etcd1_data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  etcd2:
    image: gcr.io/etcd-development/etcd:v3.5.17
    command:
      - etcd
      - --name=etcd2
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd2:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd2:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-token=outbox-etcd
      - --initial-cluster-state=new
      - --auto-compaction-retention=1
    networks: [outbox-net]
    volumes:
      - etcd2_data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  etcd3:
    image: gcr.io/etcd-development/etcd:v3.5.17
    command:
      - etcd
      - --name=etcd3
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd3:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd3:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-token=outbox-etcd
      - --initial-cluster-state=new
      - --auto-compaction-retention=1
    networks: [outbox-net]
    volumes:
      - etcd3_data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  # ---------- PostgreSQL 17 / Patroni ----------
  # Кластер готов под failover-слот outbox_slot с самого начала: wal_level=logical,
  # sync_replication_slots=on, hot_standby_feedback=on (patroni.yml, через DCS);
  # БД outbox создаёт bootstrap-метод bootstrap-with-appdb до старта Patroni.

  pg1:
    build: ./infrastructure/patroni
    image: streaming-outbox/patroni-pg17:4.1.5
    environment: &patroni-env
      PATRONI_NAME: pg1
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg1:5432
      PATRONI_RESTAPI_AUTHENTICATION_PASSWORD: ${PATRONI_API_PASSWORD:-patroni}
      PATRONI_POSTGRESQL_AUTHENTICATION_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_USERNAME: postgres
      PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    networks: [outbox-net]
    volumes:
      - pg1_data:/var/lib/postgresql/data
    ports:
      - "8008:8008"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8008/health', timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      etcd1: {condition: service_healthy}
      etcd2: {condition: service_healthy}
      etcd3: {condition: service_healthy}

  pg2:
    build: ./infrastructure/patroni
    image: streaming-outbox/patroni-pg17:4.1.5
    environment:
      <<: *patroni-env
      PATRONI_NAME: pg2
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg2:5432
    networks: [outbox-net]
    volumes:
      - pg2_data:/var/lib/postgresql/data
    ports:
      - "8009:8008"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8008/health', timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      etcd1: {condition: service_healthy}
      etcd2: {condition: service_healthy}
      etcd3: {condition: service_healthy}

  pg3:
    build: ./infrastructure/patroni
    image: streaming-outbox/patroni-pg17:4.1.5
    environment:
      <<: *patroni-env
      PATRONI_NAME: pg3
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg3:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg3:5432
    networks: [outbox-net]
    volumes:
      - pg3_data:/var/lib/postgresql/data
    ports:
      - "8010:8008"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8008/health', timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      etcd1: {condition: service_healthy}
      etcd2: {condition: service_healthy}
      etcd3: {condition: service_healthy}

  # ---------- Маршрутизация на primary ----------

  haproxy:
    image: haproxy:3.0.30-alpine
    volumes:
      - ./infrastructure/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks: [outbox-net]
    ports:
      - "5432:5432"
      - "8404:8404"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8404"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    depends_on:
      pg1: {condition: service_healthy}
      pg2: {condition: service_healthy}
      pg3: {condition: service_healthy}

  # ---------- Идемпотентная инициализация БД (one-shot) ----------
  # Создаёт роли (sys_writer/sys_replication/sys_monitor), БД outbox, схему и
  # таблицу outbox.messages, выставляет synchronized_standby_slots.
  # Publication и failover-слот НЕ создаёт — их создаёт сам outbox-сервис
  # (docs/dependencies.md §4-§5). Повторный запуск: scripts/init/apply-bootstrap.sh.

  init-db:
    image: postgres:17.2
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SYS_WRITER_PASSWORD: ${SYS_WRITER_PASSWORD:?set in .env}
      SYS_REPLICATION_PASSWORD: ${SYS_REPLICATION_PASSWORD:?set in .env}
      SYS_MONITOR_PASSWORD: ${SYS_MONITOR_PASSWORD:?set in .env}
    volumes:
      - ./infrastructure/postgres/init:/init:ro
    networks: [outbox-net]
    entrypoint:
      - /bin/bash
      - -ceu
      - |
        echo "[init-db] Waiting for Patroni primary via haproxy..."
        until psql -h haproxy -U postgres -d postgres -tAc "SELECT pg_is_in_recovery()" 2>/dev/null | grep -q f; do
          sleep 2
        done
        for f in /init/00-roles.sql /init/01-appdb-objects.sql /init/02-sync-slots.sql /init/03-outbox-publication.sql; do
          echo "[init-db] Applying $$f"
          psql -v ON_ERROR_STOP=1 -h haproxy -U postgres -d postgres \
            -v sys_writer_password="$$SYS_WRITER_PASSWORD" \
            -v sys_replication_password="$$SYS_REPLICATION_PASSWORD" \
            -v sys_monitor_password="$$SYS_MONITOR_PASSWORD" \
            -f "$$f"
        done
        echo "[init-db] Bootstrap complete."
    restart: "no"
    depends_on:
      haproxy: {condition: service_healthy}

  # ---------- Kafka KRaft ----------

  kafka1:
    image: apache/kafka:3.9.0
    environment: &kafka-env
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    networks: [outbox-net]
    volumes:
      - kafka1_data:/var/lib/kafka/data
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9092'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s

  kafka2:
    image: apache/kafka:3.9.0
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9092
    networks: [outbox-net]
    volumes:
      - kafka2_data:/var/lib/kafka/data
    ports:
      - "9093:9092"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9092'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s

  kafka3:
    image: apache/kafka:3.9.0
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9092
    networks: [outbox-net]
    volumes:
      - kafka3_data:/var/lib/kafka/data
    ports:
      - "9094:9092"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9092'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s

  # Явное создание topic'ов отдельной командой; auto.create.topics.enable=false —
  # сервисы сами topic'ы не создают (docs/dependencies.md §1). outbox.events —
  # события доставки; cdc-checkpoints — служебный checkpoint-стор outbox-сервиса
  # (1 партиция, compact; recommendations.md «Checkpoint Store в Kafka»).
  kafka-init:
    image: apache/kafka:3.9.0
    networks: [outbox-net]
    entrypoint:
      - /bin/bash
      - -ceu
      - |
        echo "[kafka-init] Creating topic outbox.events..."
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka1:9092 \
          --create --if-not-exists \
          --topic outbox.events \
          --partitions 6 \
          --replication-factor 3 \
          --config min.insync.replicas=2
        echo "[kafka-init] Creating topic cdc-checkpoints..."
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka1:9092 \
          --create --if-not-exists \
          --topic cdc-checkpoints \
          --partitions 1 \
          --replication-factor 3 \
          --config cleanup.policy=compact \
          --config min.insync.replicas=2
        echo "[kafka-init] Done."
    restart: "no"
    depends_on:
      kafka1: {condition: service_healthy}
      kafka2: {condition: service_healthy}
      kafka3: {condition: service_healthy}

  # ---------- Writer (тестовый контур) ----------

  # Генератор нагрузки: INSERT+DELETE-батчи в outbox.messages от sys_writer,
  # напрямую через haproxy:5432 (PgBouncer в стенде отсутствует — решение
  # владельца). НЕ зависит от Kafka: запись продолжается при полной
  # недоступности брокеров — depends_on закрывает только путь записи.
  # Хост-порт 18080: 8080 на этой машине занят контейнером другого проекта.
  writer:
    build: ./src/Writer
    image: streaming-outbox/writer:net8.0
    environment:
      ASPNETCORE_URLS: http://+:8080
      WRITER__CONNECTION__HOST: haproxy
      WRITER__CONNECTION__PORT: "5432"
      WRITER__CONNECTION__DATABASE__NAME: outbox
      WRITER__CONNECTION__DATABASE__USERNAME: sys_writer
      WRITER__CONNECTION__DATABASE__PASSWORD: ${SYS_WRITER_PASSWORD:?set in .env}
      WRITER__DEFAULTS__MESSAGESIZEBYTES: "1024"
      WRITER__DEFAULTS__PARALLELISM: "4"
      WRITER__DEFAULTS__BATCHSIZE: "100"
    networks: [outbox-net]
    ports:
      - "${WRITER_HTTP_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      haproxy: {condition: service_healthy}

  # ---------- KafkaValidator (тестовый контур) ----------
  # Живой индекс содержимого topic outbox.events: consumer-группа kafka-validator
  # с auto.offset.reset=earliest и БЕЗ сохранения оффсетов — каждый старт читает
  # topic с начала и полностью восстанавливает счётчики всех прогонов.
  # До появления outbox-сервиса вердикты прогонов показывают missing=all
  # (записано в WAL, но некому доставить в Kafka) — это ожидаемо.
  kafka-validator:
    build: ./src/KafkaValidator
    image: streaming-outbox/kafka-validator:net8.0
    environment:
      ASPNETCORE_URLS: http://+:8080
      KAFKAVALIDATOR__KAFKA__BROKERS: kafka1:9092,kafka2:9092,kafka3:9092
      KAFKAVALIDATOR__KAFKA__TOPIC: outbox.events
      KAFKAVALIDATOR__KAFKA__GROUPID: kafka-validator
      KAFKAVALIDATOR__WRITER__BASEURL: http://writer:8080
    networks: [outbox-net]
    ports:
      - "${KAFKA_VALIDATOR_HTTP_PORT:-18083}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      kafka1: {condition: service_healthy}
      kafka2: {condition: service_healthy}
      kafka3: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      # ожидаемый набор id берётся у Writer по запросу (fetchFromWriter)
      writer: {condition: service_healthy}

  # ---------- CdcOutbox (outbox-сервис) ----------
  # Резервирование — Active-Passive (арбитр — Kafka Consumer Group на служебном
  # topic cdc-checkpoints — создаёт kafka-init; модель — docs/stand.md
  # «Резервирование cdc-outbox»).
  # Второй экземпляр — за compose-профилем redundancy (решение владельца):
  # без флага compose его не поднимает; включение —
  # docker compose --profile redundancy up -d --no-deps cdc-outbox-2
  # (+ вернуть таргет cdc-outbox-2 в prometheus.yml и рестарт prometheus).
  # Конфигурация — env CDCOUTBOX__* (таблица — docs/dependencies.md §2
  # «Конфигурация outbox-сервиса»): подключение PG одной строкой, пароль
  # интерполяцией из .env; env одинаков у обоих экземпляров (якорь),
  # образ общий, host-порты разные.
  cdc-outbox-1:
    build:
      context: ./src
      dockerfile: CdcOutbox.Host/Dockerfile
    image: streaming-outbox/cdc-outbox:net8.0
    environment: &cdc-outbox-env
      ASPNETCORE_URLS: http://+:8080
      CDCOUTBOX__POSTGRES__CONNECTIONSTRING: "Host=haproxy;Port=5432;Database=outbox;Username=sys_replication;Application Name=cdc-outbox;Password=${SYS_REPLICATION_PASSWORD:?set in .env}"
      CDCOUTBOX__REPLICATION__SLOTNAME: outbox_slot
      CDCOUTBOX__REPLICATION__PUBLICATIONNAME: outbox_publication
      CDCOUTBOX__STORAGE__SCHEMA: outbox
      CDCOUTBOX__STORAGE__TABLE: messages
      CDCOUTBOX__KAFKA__BOOTSTRAPSERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      CDCOUTBOX__KAFKA__ACKS: all
      CDCOUTBOX__KAFKA__ENABLEIDEMPOTENCE: "true"
      CDCOUTBOX__KAFKA__BATCHNUMMESSAGES: "10000"
      CDCOUTBOX__KAFKA__LINGERMS: "5"
      CDCOUTBOX__KAFKA__DELIVERYTIMEOUTMS: "120000"
      CDCOUTBOX__KAFKA__MESSAGESENDMAXRETRIES: "2147483647"
      CDCOUTBOX__KAFKA__MESSAGEMAXBYTES: "1000000"
      CDCOUTBOX__KAFKA__CHECKPOINTTOPIC: cdc-checkpoints
      CDCOUTBOX__PROCESSOR__QUEUECAPACITY: "2048"
      CDCOUTBOX__PROCESSOR__BATCHSIZE: "500"
      CDCOUTBOX__PROCESSOR__CHECKPOINTINTERVALSECONDS: "5"
      CDCOUTBOX__PROCESSOR__IDLETIMEOUTSECONDS: "30"
    networks: [outbox-net]
    ports:
      - "${CDC_OUTBOX_1_HTTP_PORT:-18084}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      haproxy: {condition: service_healthy}
      kafka1: {condition: service_healthy}
      kafka2: {condition: service_healthy}
      kafka3: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}

  cdc-outbox-2:
    profiles: ["redundancy"]
    build:
      context: ./src
      dockerfile: CdcOutbox.Host/Dockerfile
    image: streaming-outbox/cdc-outbox:net8.0
    environment:
      <<: *cdc-outbox-env
    networks: [outbox-net]
    ports:
      - "${CDC_OUTBOX_2_HTTP_PORT:-18085}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      haproxy: {condition: service_healthy}
      kafka1: {condition: service_healthy}
      kafka2: {condition: service_healthy}
      kafka3: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}

  # ---------- Prometheus ----------

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [outbox-net]
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  # ---------- Exporters метрик инфраструктуры ----------
  # Порты наружу не публикуются: scrape только внутри сети, проверки с хоста —
  # через Prometheus API (localhost:9090). Образы без shell (distroless/scratch) —
  # без healthcheck; их работоспособность проверяет target-up в Prometheus.

  # PostgreSQL: replication lag, состояние logical slot (появится с outbox-сервисом),
  # WAL retention. Подключение напрямую через HAProxy (всегда primary; экспортеру
  # достаточно одного собственного соединения) от роли sys_monitor
  # (00-roles.sql: pg_monitor, без REPLICATION).
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    command:
      # Выключаем несовместимые/дублирующие встроенные коллекторы:
      #  - stat_bgwriter ломается на PG17 (колонки checkpoints_* переехали
      #    в pg_stat_checkpointer; фикс есть только в новых версиях экспортера);
      #  - database коннектится к каждой БД кластера — у sys_monitor CONNECT
      #    только на outbox, а per-DB статистика не нужна;
      #  - wal дублируется кастомными запросами queries.yaml (pg_wal_position,
      #    pg_wal_dir) — один документированный источник правды.
      - --no-collector.stat_bgwriter
      - --no-collector.database
      - --no-collector.wal
    environment:
      DATA_SOURCE_NAME: postgresql://sys_monitor:${SYS_MONITOR_PASSWORD:?set in .env}@haproxy:5432/outbox?sslmode=disable
      # В v0.15 префикс PG_EXPORTER_* (POSTGRES_EXPORTER_* появился позже)
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yaml
    volumes:
      - ./infrastructure/prometheus/postgres-exporter-queries.yaml:/etc/postgres-exporter/queries.yaml:ro
    networks: [outbox-net]
    restart: unless-stopped
    depends_on:
      haproxy: {condition: service_healthy}

  # Kafka: доступность брокеров, offsets топиков, consumer lag. Говорит по
  # обычному PLAINTEXT-протоколу, сами брокеры не настраиваются.
  # Брокеры передаются флагами: бинарник не читает env KAFKA_BROKERS
  # (без флагов остаётся на дефолте kafka:9092).
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    command:
      - --kafka.server=kafka1:9092
      - --kafka.server=kafka2:9092
      - --kafka.server=kafka3:9092
    networks: [outbox-net]
    restart: unless-stopped
    depends_on:
      kafka1: {condition: service_healthy}
      kafka2: {condition: service_healthy}
      kafka3: {condition: service_healthy}
